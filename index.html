<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cancer Awareness & Support</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="banner">
      <h1>Cancer Awareness &Support</h1>
      <p>Together we fight, together we heal.</p>
    </header>

    <section class="info">
      <h2>Early detection Saves Lives</h2>
      <p>
        Understanding the signs and spreading awareness can help save millions. Join us in
        suporting individuals and families impacted by Cancer.
      </p>
    </section>

    <section class="contact">
      <h2>Contact us</h2>
      <form>
        <input type="text" placeholder="Your Name" required />
        <input type="email" placeholder="Your Email" required />
        <textarea placeholder="Your Message" rows="6" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </section>

    <section class="quote">
      <h2>Daily Inspirational Qoute</h2>
      <p id="quote">Loading...</p>
      <button type="button" onclick="loadquote()">Refresh quote</button>
    </section>
    <script src="script.js"></script>
  </body>
</html>
